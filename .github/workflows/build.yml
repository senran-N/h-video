name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Cloudstream Gradle plugin locally
        # JitPack is flaky for com.github.recloudstream:gradle:-SNAPSHOT,
        # so build it from source into mavenLocal. build.gradle.kts
        # lists mavenLocal() first and falls back to JitPack on cache miss.
        run: |
          git clone --depth 1 https://github.com/recloudstream/gradle /tmp/cs-gradle
          printf '%s\n' \
            'gradle.projectsEvaluated {' \
            '    gradle.rootProject {' \
            '        group = "com.github.recloudstream"' \
            '        version = "-SNAPSHOT"' \
            '    }' \
            '}' > /tmp/cs-gradle/fixcoords.init.gradle
          cd /tmp/cs-gradle
          chmod +x gradlew
          ./gradlew publishToMavenLocal -I /tmp/cs-gradle/fixcoords.init.gradle --console=plain

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force
